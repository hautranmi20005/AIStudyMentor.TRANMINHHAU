services:
  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_DATABASE: ai_study_mentor
      MYSQL_USER: studymentor_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Generate backend/.env first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Generate backend/.env first}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:${DEV_MYSQL_PORT:-3306}:3306"
    volumes:
      - dev_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql -h 127.0.0.1 -uroot --silent -Nse 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4.2-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate backend/.env first}
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-6379}:6379"
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:${DEV_MAIL_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${DEV_MAIL_UI_PORT:-8025}:8025"
    volumes:
      - dev_mailpit_data:/data
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8025/livez"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  dev_mysql_data:
  dev_redis_data:
  dev_mailpit_data:
