<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Confirm guardian consent</title>
</head>
<body style="margin:0;background:#f3f6fb;font-family:Arial,Helvetica,sans-serif;color:#172033;">
  <main style="box-sizing:border-box;max-width:560px;margin:48px auto;padding:32px;background:#ffffff;border-radius:12px;">
    <p style="margin:0 0 8px;color:#52617a;font-size:13px;font-weight:bold;letter-spacing:1px;">AI STUDY MENTOR</p>
    <h1 style="font-size:24px;line-height:1.3;">Confirm your decision</h1>
    <p style="font-size:16px;line-height:1.6;">You are about to <strong>{{decision}}</strong> guardian consent for this student account.</p>
    <p style="font-size:14px;line-height:1.6;color:#52617a;">No account changes occur until you select the confirmation button below.</p>
    <form method="post" action="/api/v1/guardian-consent/verify">
      <input type="hidden" name="token" value="{{token}}">
      <input type="hidden" name="action" value="{{action}}">
      <button type="submit" style="padding:13px 20px;border:0;border-radius:6px;background:#174ea6;color:#ffffff;font-size:15px;font-weight:bold;cursor:pointer;">
        Confirm {{decision}}
      </button>
    </form>
  </main>
</body>
</html>
