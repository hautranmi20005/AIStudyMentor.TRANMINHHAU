server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ai-study-mentor-backend
  datasource:
    url: ${DB_URL:jdbc:h2:mem:ai_study_mentor;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    from: ${MAIL_FROM:no-reply@localhost}
  guardian-consent:
    reminder-scan-delay-ms: ${GUARDIAN_CONSENT_REMINDER_SCAN_DELAY_MS:3600000}
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-on-validation-error: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:dev_only_jwt_secret_must_be_at_least_32_bytes_long_123456}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    mfa-session-expiration-ms: ${JWT_MFA_SESSION_EXPIRATION_MS:300000}
  security:
    mfa-encryption-key: ${MFA_ENCRYPTION_KEY:dev_aes_key_32_bytes_length_123456}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      key-prefix: ${RATE_LIMIT_KEY_PREFIX:studymentor:rate-limit}
      login:
        limit: ${RATE_LIMIT_LOGIN_LIMIT:10}
        window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
      register:
        limit: ${RATE_LIMIT_REGISTER_LIMIT:5}
        window-seconds: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:3600}
      refresh:
        limit: ${RATE_LIMIT_REFRESH_LIMIT:30}
        window-seconds: ${RATE_LIMIT_REFRESH_WINDOW_SECONDS:60}
      mfa:
        limit: ${RATE_LIMIT_MFA_LIMIT:5}
        window-seconds: ${RATE_LIMIT_MFA_WINDOW_SECONDS:900}
      ai:
        limit: ${RATE_LIMIT_AI_LIMIT:20}
        window-seconds: ${RATE_LIMIT_AI_WINDOW_SECONDS:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    api-version: ${GEMINI_API_VERSION:v1beta}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
