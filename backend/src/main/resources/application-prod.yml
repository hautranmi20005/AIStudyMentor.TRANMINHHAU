spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:5s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:3s}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:true}
  flyway:
    locations: classpath:db/postgresql-migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
  mail:
    host: ${MAIL_HOST:smtp.sendgrid.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:apikey}
    password: ${SENDGRID_API_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when-authorized
  security:
    username: ${MANAGEMENT_USERNAME}
    password: ${MANAGEMENT_PASSWORD}

app:
  mail:
    from: ${MAIL_FROM}
  guardian-consent:
    reminder-scan-delay-ms: ${GUARDIAN_CONSENT_REMINDER_SCAN_DELAY_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      key-prefix: ${RATE_LIMIT_KEY_PREFIX:studymentor:rate-limit}
      login:
        limit: ${RATE_LIMIT_LOGIN_LIMIT:10}
        window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
      register:
        limit: ${RATE_LIMIT_REGISTER_LIMIT:5}
        window-seconds: ${RATE_LIMIT_REGISTER_WINDOW_SECONDS:3600}
      refresh:
        limit: ${RATE_LIMIT_REFRESH_LIMIT:30}
        window-seconds: ${RATE_LIMIT_REFRESH_WINDOW_SECONDS:60}
      mfa:
        limit: ${RATE_LIMIT_MFA_LIMIT:5}
        window-seconds: ${RATE_LIMIT_MFA_WINDOW_SECONDS:900}
      ai:
        limit: ${RATE_LIMIT_AI_LIMIT:20}
        window-seconds: ${RATE_LIMIT_AI_WINDOW_SECONDS:60}
