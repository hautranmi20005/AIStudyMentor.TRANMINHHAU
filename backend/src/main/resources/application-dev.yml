# ==============================================================================
# LOCAL DEVELOPMENT PROFILE ONLY - NEVER FOR PRODUCTION
# ==============================================================================
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
    address: 127.0.0.1
  security:
    username: ${MANAGEMENT_USERNAME}
    password: ${MANAGEMENT_PASSWORD}

app:
  dev-seed:
    password: ${DEV_SEED_PASSWORD}
    totp-secret: ${DEV_SEED_TOTP_SECRET}
  jwt:
    secret: ${JWT_SECRET}
  security:
    mfa-encryption-key: ${MFA_ENCRYPTION_KEY}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    api-version: ${GEMINI_API_VERSION:v1beta}
    fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-flash-latest}
